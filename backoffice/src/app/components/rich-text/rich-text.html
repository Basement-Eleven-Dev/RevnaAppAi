<div class="editor" [class.disabilitato]="disabilitato()">
  <!-- `mousedown` annullato su ogni bottone: senza, il clic porterebbe via il fuoco
       dal testo, la selezione si perderebbe e il comando non avrebbe su cosa agire. -->
  <div class="barra" role="toolbar" aria-label="Formattazione">
    <button
      type="button"
      class="strumento"
      title="Grassetto (Ctrl+B)"
      aria-label="Grassetto"
      [class.on]="stato().grassetto"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="comando('bold')"
    >
      <strong>B</strong>
    </button>

    <button
      type="button"
      class="strumento"
      title="Corsivo (Ctrl+I)"
      aria-label="Corsivo"
      [class.on]="stato().corsivo"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="comando('italic')"
    >
      <em>I</em>
    </button>

    <span class="separatore"></span>

    <button
      type="button"
      class="strumento"
      title="Titolo"
      [class.on]="stato().titolo"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="blocco('h2')"
    >
      Titolo
    </button>

    <button
      type="button"
      class="strumento"
      title="Sottotitolo"
      [class.on]="stato().sottotitolo"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="blocco('h3')"
    >
      Sottotitolo
    </button>

    <span class="separatore"></span>

    <button
      type="button"
      class="strumento"
      title="Elenco puntato"
      aria-label="Elenco puntato"
      [class.on]="stato().elenco"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="comando('insertUnorderedList')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 6h11M9 12h11M9 18h11" />
        <circle cx="4.5" cy="6" r="1.2" />
        <circle cx="4.5" cy="12" r="1.2" />
        <circle cx="4.5" cy="18" r="1.2" />
      </svg>
    </button>

    <button
      type="button"
      class="strumento"
      title="Elenco numerato"
      aria-label="Elenco numerato"
      [class.on]="stato().numerato"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="comando('insertOrderedList')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9 6h11M9 12h11M9 18h11M3 5l1.5-.8V8M3 11h2.4L3 14h2.4" />
      </svg>
    </button>

    <button
      type="button"
      class="strumento"
      title="Citazione"
      aria-label="Citazione"
      [class.on]="stato().citazione"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="blocco('blockquote')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5v14M9 8h11M9 12h11M9 16h7" />
      </svg>
    </button>

    <span class="separatore"></span>

    <button
      type="button"
      class="strumento"
      title="Inserisci un link"
      aria-label="Inserisci un link"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="link()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1" />
        <path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1" />
      </svg>
    </button>

    @if (upload()) {
      <label class="strumento picker" title="Inserisci un'immagine">
        <input
          type="file"
          accept="image/*"
          [disabled]="disabilitato() || caricando()"
          (change)="onFile($event)"
        />
        @if (caricando()) {
          <span class="caricamento">Caricamento…</span>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <circle cx="8.5" cy="9.5" r="1.5" />
            <path d="M21 16l-5-5-6 6" />
          </svg>
        }
      </label>
    }

    <span class="separatore"></span>

    <button
      type="button"
      class="strumento"
      title="Riga di separazione"
      aria-label="Riga di separazione"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="comando('insertHorizontalRule')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 12h16" />
      </svg>
    </button>

    <button
      type="button"
      class="strumento"
      title="Togli la formattazione"
      aria-label="Togli la formattazione"
      [disabled]="disabilitato()"
      (mousedown)="$event.preventDefault()"
      (click)="comando('removeFormat')"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </div>

  <div class="foglio">
    @if (vuoto() && placeholder()) {
      <p class="placeholder" aria-hidden="true">{{ placeholder() }}</p>
    }

    <div
      #editor
      class="testo"
      [attr.contenteditable]="disabilitato() ? 'false' : 'true'"
      role="textbox"
      aria-multiline="true"
      [attr.aria-label]="placeholder() || 'Testo della comunicazione'"
      (input)="onInput()"
      (blur)="onBlur()"
      (paste)="onPaste($event)"
      (keyup)="refresh()"
      (mouseup)="refresh()"
    ></div>
  </div>

  @if (errore()) {
    <p class="error">{{ errore() }}</p>
  }
</div>
