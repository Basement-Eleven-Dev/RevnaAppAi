<div class="layout">
  <aside class="sidebar">
    <a class="brand" routerLink="/clienti">
      <img src="brand/logo_dark.svg" alt="Revna" />
    </a>

    <nav>
      <a class="voce" routerLink="/clienti" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9.5" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        Clienti
      </a>

      <a class="voce" routerLink="/richieste" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M15.5 21A12.5 12.5 0 0 1 3 8.5V6a2 2 0 0 1 2-2h2.3a1 1 0 0 1 1 .8l.7 3.2a1 1 0 0 1-.5 1.1L7 10.2a10.2 10.2 0 0 0 4.9 4.9l1.1-1.5a1 1 0 0 1 1.1-.5l3.2.7a1 1 0 0 1 .8 1V17a2 2 0 0 1-2 2h-.6Z"
          />
        </svg>
        Richieste
      </a>

      <a class="voce" routerLink="/comunicazioni" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 11v2a1 1 0 0 0 1 1h2l4 3.5V6.5L6 10H4a1 1 0 0 0-1 1Z" />
          <path d="M14 8.5a5 5 0 0 1 0 7" />
          <path d="M17 6a8 8 0 0 1 0 12" />
        </svg>
        Comunicazioni
      </a>

      <a class="voce" routerLink="/assistente" routerLinkActive="active">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"
          />
        </svg>
        Assistente
      </a>

      <div class="sotto">
        <a
          routerLink="/assistente"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          Personalità
        </a>
        <a routerLink="/assistente/conoscenza" routerLinkActive="active">Base di conoscenza</a>
        <a routerLink="/assistente/prova" routerLinkActive="active">Prova</a>
      </div>
    </nav>

    <div class="spacer"></div>

    <div class="operatore">
      <span class="chi">{{ operatore()?.email }}</span>
      <button type="button" class="ghost" (click)="logout()">Esci</button>
    </div>
  </aside>

  <div class="contenuto">
    <router-outlet />
  </div>
</div>
